<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD — Комплексный тест FTOS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        .hero {
            padding: 30px;
            background: linear-gradient(180deg, #1e293b 0%, #111827 100%);
            border-bottom: 1px solid #1f2937;
        }

        .badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .hero-title {
            font-size: 24px;
            font-weight: 800;
            color: #f8fafc;
        }

        .content {
            padding: 30px;
        }

        .section-card {
            background-color: #161e2e;
            border: 1px solid #232d3f;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .user-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .input-group input {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #38bdf8;
        }

        .question-card {
            background-color: #1a2332;
            border: 1px solid #283548;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .question-text {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #111827;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            cursor: pointer;
            font-size: 14px;
            color: #d1d5db;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            border-color: #38bdf8;
            background-color: #131d31;
        }

        .option-label input[type="radio"] {
            accent-color: #38bdf8;
        }

        .submit-btn {
            width: 100%;
            background-color: #0284c7;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #0369a1;
        }

        .submit-btn:disabled {
            background-color: #334155;
            cursor: not-allowed;
        }

        /* Карточка результатов */
        #resultCard {
            display: none;
            background-color: #161e2e;
            border: 1px solid #232d3f;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 24px;
        }

        .result-score {
            font-size: 48px;
            font-weight: 800;
            margin: 15px 0;
        }

        .status-passed { color: #4ade80; }
        .status-failed { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <span class="badge">Field Training Officer Section</span>
        <h1 class="hero-title">LSPD — Квалификационный тест FTO</h1>
    </div>

    <div class="content">
        <!-- Блок отображения результата -->
        <div id="resultCard">
            <h2>Результаты тестирования</h2>
            <div id="scoreDisplay" class="result-score">0%</div>
            <p id="statusText" style="font-size: 18px; margin-bottom: 10px;"></p>
            <p id="detailsText" style="color: #9ca3af; font-size: 14px;"></p>
        </div>

        <form id="ftoForm">
            <!-- Данные кандидата -->
            <div class="section-card">
                <h3 style="margin-bottom: 12px; color: #38bdf8;">Персональные данные</h3>
                <div class="user-info-grid">
                    <div class="input-group">
                        <label>Имя Фамилия (IC)</label>
                        <input type="text" id="icName" required placeholder="John Doe">
                    </div>
                    <div class="input-group">
                        <label>Discord Tag / ID</label>
                        <input type="text" id="discordTag" required placeholder="user#0000 или ID">
                    </div>
                </div>
            </div>

            <!-- Контейнер для вопросов -->
            <div id="questionsContainer"></div>

            <button type="submit" id="submitBtn" class="submit-btn">Завершить и отправить тест</button>
        </form>
    </div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШ WEBHOOK DISCORD
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1536702720076025866/tNljQFBjKVPNXWcwJn7eD2aXTH9P1Mw7qYbhdCLKa_KCPxhImzrWADI2mcXPI_fNYxbV";

    // База из 26 вопросов
    const questionsData = [
        { id: "q1", text: "1. На чём строится квалификационный контроль соблюдения законов стажёром?", options: ["А) На строгости Уголовного кодекса", "Б) На усмотрении шефа", "В) На регулярной проверке рапорта", "Г) На свободной оценке FTO"], correct: 0 },
        { id: "q2", text: "2. Какова ключевая цель фиксации систематических проступков стажёра?", options: ["А) Наказание выговором", "Б) Понижение в звании", "В) Перевод в другой отдел", "Г) Выявить нарушения мануала для дальнейшего увольнения"], correct: 3 },
        { id: "q3", text: "3. Является ли активность на форуме и знания законов одним из критериев оценки?", options: ["А) Да, это один из главных критериев оценки", "Б) Нет, учитывается только патруль", "В) Только по решению куратора", "Г) Нет, только теория"], correct: 0 },
        { id: "q4", text: "4. Имеет ли право стажёр выходить в патруль в одиночку?", options: ["А) Да, в любом юните", "Б) Да, но только ночью", "В) Нет, категорически запрещено", "Г) Выйти в патруль в одиночку в юните LINCOLN (при специальном допуске)"], correct: 3 },
        { id: "q5", text: "5. Что означает статус FTO 'LOA / Leave of Absence'?", options: ["А) Увольнение из отдела", "Б) Статус FTO, которые из-за личных обстоятельств не могут полноценно взять стажёра", "В) Назначение куратором", "Г) Прохождение переаттестации"], correct: 1 },
        { id: "q6", text: "6. Что из перечисленного входит в базовый набор требований к кандидату в FTO?", options: ["А) Наличие спорткара", "Б) Знание законов, активность на форуме, субординация", "В) 100 часов в игре за неделю", "Г) Опыт работы в SWAT"], correct: 1 },
        { id: "q7", text: "7. Где происходит координация и поиск стажёра перед патрулем?", options: ["А) Ищет в TeamSpeak", "Б) Через глобальный чат", "В) Через СМС в игре", "Г) В рации спец. связи"], correct: 0 },
        { id: "q8", text: "8. Куда подаётся рапорт при обнаружении грубых нарушений законодательства FTO или стажёром?", options: ["А) В жалобы на игроков", "Б) В личные сообщения шефу", "В) В прокуратуру", "Г) Написать жалобу в HRB"], correct: 3 },
        { id: "q9", text: "9. В чём заключается первоочередная задача FTO при неадекватных действиях стажёра?", options: ["А) Открыть огонь", "Б) Предотвращение противоправных или неэтичных действий стажёра", "В) Игнорировать и доложить позже", "Г) Выдать выговор на месте"], correct: 1 },
        { id: "q10", text: "10. Какое правило регламентирует вопросы стажёра во время активных ситуаций?", options: ["А) Запрещено задавать вопросы вообще", "Б) Можно перебивать старших", "В) Стажёру запрещено задавать вопросы в момент проведения кода 3", "Г) Разрешено только в чат"], correct: 2 },
        { id: "q11", text: "11. Каким образом FTO рекомендуют оценивать уровень мышления стажёра?", options: ["А) Прямым допросом", "Б) Непрямым методом выудить текущие навыки стажёра, его мышление и манеру общения", "В) Письменным тестом на 100 вопросов", "Г) Наблюдением со стороны"], correct: 1 },
        { id: "q12", text: "12. Как меняется контроль FTO на заключительном этапе (Final Phase)?", options: ["А) Контроль усиливается", "Б) Без изменений", "В) FTO делает всю работу сам", "Г) Контроль полностью снимается"], correct: 3 },
        { id: "q13", text: "13. Какова основная роль FTO по отношению к закрепившемуся за ним стажёру?", options: ["А) Руководитель и строгий экзаменатор", "Б) Напарник на равных", "В) Личный водитель", "Г) Наблюдатель"], correct: 0 },
        { id: "q14", text: "14. Какая минимальная оценка допускается в бланке DOR для прохождения этапа?", options: ["А) Оценка 1", "Б) Оценка 2 и выше по каждому пункту бланка", "В) Оценка 4 и выше", "Г) Средний балл 3.0"], correct: 1 },
        { id: "q15", text: "15. Сколько патрулей минимально должен откатать стажёр за всю программу FTP?", options: ["А) 5 патрулей", "Б) 10 патрулей", "В) 14 патрулей", "Г) 20 патрулей"], correct: 2 },
        { id: "q16", text: "16. Каков максимальный срок на прохождение адаптационной программы FTP?", options: ["А) 7 дней", "Б) 14 дней", "В) 30 дней", "Г) Без ограничений"], correct: 2 },
        { id: "q17", text: "17. Кто может подать заявление на прекращение стажировки?", options: ["А) Только Шеф", "Б) Куратор FTP", "В) Сам стажёр по личному заявлению", "Г) Заступивший FTO"], correct: 2 },
        { id: "q18", text: "18. Чем является направление стажёра на Remedial Training (доп. обучение)?", options: ["А) Поощрением", "Б) Обычной процедурой", "В) Как последнюю предупредительную санкцию перед исключением", "Г) Автоматическим увольнением"], correct: 2 },
        { id: "q19", text: "19. Кто утверждал текущую редакцию руководства Field Training Program?", options: ["А) Шеф LSPD", "Б) Губернатор", "В) Шериф LSSD", "Г) Глава HRB"], correct: 2 },
        { id: "q20", text: "20. Какой автотранспорт используется для базового патрулирования FTO и стажёра?", options: ["А) Немаркированный султан", "Б) Базовый патрульный автомобиль (юниты A или X)", "В) Мотоцикл", "Г) Скоростной перехватчик"], correct: 1 },
        { id: "q21", text: "21. В каком случае FTO имеет право в одностороннем порядке отказаться от патруля со стажёром?", options: ["А) Если плохая погода", "Б) Если стажёр неуважительно общается", "В) Только если стажёр отказался выходить в патруль", "Г) По желанию FTO"], correct: 2 },
        { id: "q22", text: "22. Как разделены критерии оценки в ежедневном отчёте (DOR)?", options: ["А) По 3 подкатегориям", "Б) По 5 подкатегориям", "В) Единым списком", "Г) На 2 блока"], correct: 0 },
        { id: "q23", text: "23. Каков норматив по общему количеству патрулей для допуска к итоговому экзамену?", options: ["А) 10 патрулей", "Б) Стажёр должен отъехать минимум 30 патрулей", "В) 15 патрулей", "Г) 50 патрулей"], correct: 1 },
        { id: "q24", text: "24. Какое минимальное число составленных отчётов DOR должно быть в личном деле?", options: ["А) Не менее 3 отчетов", "Б) Не менее 5 отчетов", "В) Не менее 8 отчетов", "Г) Ровно 10 отчетов"], correct: 2 },
        { id: "q25", text: "25. Какая процедура назначается стажёру, не сдавшему Phase 2?", options: ["А) Назначается дополнительно 6 патрулей ориентации", "Б) Немедленное увольнение", "В) Перевод в дежурку", "Г) Повторный письменный тест"], correct: 0 },
        { id: "q26", text: "26. В каком формате разрешён патруль на этапе Final Evaluation?", options: ["А) Только в одиночку в юните L", "Б) Втроём с двумя FTO", "В) Только с куратором", "Г) В юните ADAM"], correct: 0 }
    ];

    // Рендер вопросов
    const container = document.getElementById('questionsContainer');
    questionsData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let optionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <label class="option-label">
                    <input type="radio" name="${q.id}" value="${optIndex}" required>
                    <span>${opt}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-text">${q.text}</div>
            <div class="options-list">${optionsHTML}</div>
        `;
        container.appendChild(card);
    });

    // Обработка формы через JS (метод POST без перезагрузки)
    document.getElementById('ftoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Обработка и отправка...";

        const icName = document.getElementById('icName').value;
        const discordTag = document.getElementById('discordTag').value;

        let score = 0;
        let details = [];

        questionsData.forEach(q => {
            const selected = document.querySelector(`input[name="${q.id}"]:checked`);
            const answerIndex = selected ? parseInt(selected.value) : -1;
            const isCorrect = answerIndex === q.correct;
            
            if (isCorrect) score++;
            
            details.push({
                question: q.text,
                selected: selected ? q.options[answerIndex] : "Нет ответа",
                isCorrect: isCorrect
            });
        });

        const total = questionsData.length;
        const percentage = Math.round((score / total) * 100);
        const isPassed = percentage >= 80; // Проходной балл 80%

        // Отображение результата кандидату
        const resultCard = document.getElementById('resultCard');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const statusText = document.getElementById('statusText');
        const detailsText = document.getElementById('detailsText');

        resultCard.style.display = 'block';
        scoreDisplay.innerText = `${percentage}%`;
        scoreDisplay.className = `result-score ${isPassed ? 'status-passed' : 'status-failed'}`;
        statusText.innerText = isPassed ? "ТЕСТ УСПЕШНО СДАН" : "ТЕСТ НЕ СДАН";
        statusText.className = isPassed ? 'status-passed' : 'status-failed';
        detailsText.innerText = `Правильных ответов: ${score} из ${total}`;

        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Формирование Payload для Discord Webhook
        const embedPayload = {
            username: "FTO Test System",
            avatar_url: "https://i.imgur.com/8N4I29S.png",
            embeds: [{
                title: `Результаты теста FTO: ${icName}`,
                color: isPassed ? 5025616 : 16285041, // Зеленый / Красный
                fields: [
                    { name: "Имя Кандидата (IC)", value: icName, inline: true },
                    { name: "Discord", value: discordTag, inline: true },
                    { name: "Результат", value: `**${score}/${total}** (${percentage}%)`, inline: true },
                    { name: "Статус", value: isPassed ? "✅ Сдал" : "❌ Не сдал", inline: true }
                ],
                footer: { text: "LSPD Field Training Program" },
                timestamp: new Date().toISOString()
            }]
        };

        // Отправка в Discord
        try {
            if (DISCORD_WEBHOOK_URL && !DISCORD_WEBHOOK_URL.includes("https://discord.com/api/webhooks/1536702720076025866/tNljQFBjKVPNXWcwJn7eD2aXTH9P1Mw7qYbhdCLKa_KCPxhImzrWADI2mcXPI_fNYxbV")) {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(embedPayload)
                });
            }
        } catch (err) {
            console.error("Ошибка отправки в Discord Webhook:", err);
        }

        submitBtn.style.display = 'none';
    });
</script>
</body>
</html>
