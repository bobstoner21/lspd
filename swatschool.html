<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школа SWAT</title>
  <link rel="stylesheet" href="style.css?v=13">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="portal-header">
      <div class="result-badge">SPECIAL WEAPONS AND TACTICS</div>
      <h1>Тактический тест SWAT</h1>
      <p style="color: #9ca3af;">Проверка знаний штурмовых построений, освобождения заложников и работы в опасных зонах.</p>
    </div>

    <form id="quizForm" onsubmit="processQuizSubmission(event, 'SWAT', 'Тактическая школа SWAT')">
      <div class="form-step active">
        <div class="section-header"><h2>Данные кандидата</h2></div>
        <div class="form-group">
          <label>Имя и Фамилия (IC) *</label>
          <input type="text" id="ic_name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Discord / OOC данные *</label>
          <input type="text" id="ooc_name" required placeholder="username#0000">
        </div>
      </div>

      <div class="qa-group form-group" style="margin-top: 25px;">
        <label class="question-title">1. Сравнительный анализ тактики входа «Крюк» (Hook) и «Перекрёстный вход» (Crossover). В каких условиях выбирается каждая?</label>
        <textarea required placeholder="Введите ваш развернутый ответ..."></textarea>
      </div>

      <div class="qa-group form-group">
        <label class="question-title">2. Протокол действий группы при ранении старшего группы в опасной зоне («красной зоне») и полной потере связи?</label>
        <textarea required placeholder="Введите ваш развернутый ответ..."></textarea>
      </div>

      <div class="qa-group form-group">
        <label class="question-title">3. Порядок штурма объекта при наличии забаррикадированного вооружённого подозреваемого с заложниками?</label>
        <textarea required placeholder="Введите ваш развернутый ответ..."></textarea>
      </div>

      <div style="margin-top: 30px; display: flex; gap: 15px;">
        <a href="index.html" class="btn btn-secondary" style="text-decoration:none; text-align:center;">Отмена</a>
        <button type="submit" class="btn btn-primary">Завершить и отправить</button>
      </div>
    </form>
  </div>

  <script src="quiz-handler.js"></script>
</body>
</html>
