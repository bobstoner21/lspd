<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Результаты тестирования</title>
  <link rel="stylesheet" href="style.css?v=13">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .result-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin: 25px 0 35px 0;
    }
    .info-box {
      background: #1e293b;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 15px;
    }
    .info-box label {
      display: block;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .info-box span {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .qa-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 15px;
    }
    .qa-card h3 {
      font-size: 0.95rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .qa-card p {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="portal-header" style="text-align: left;">
      <div class="result-badge" id="reportBadge">EVALUATION REPORT</div>
      <h1 id="reportTitle">Результаты прохождения теста</h1>
      <p style="color: #9ca3af;">Итоговая карточка прохождения теста кандидатом.</p>
    </div>

    <!-- Информационные блоки -->
    <div class="info-grid">
      <div class="info-box">
        <label>IC Никнейм</label>
        <span id="resIc">-</span>
      </div>
      <div class="info-box">
        <label>OOC / Discord</label>
        <span id="resOoc">-</span>
      </div>
      <div class="info-box">
        <label>Время прохождения</label>
        <span id="resTime">-</span>
      </div>
      <div class="info-box">
        <label>Уходов с вкладок</label>
        <span id="resTabs" style="color: #f59e0b;">0 раз(а)</span>
      </div>
    </div>

    <!-- Вопросы и ответы -->
    <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Ответы кандидата</h2>
    <div id="qaContainer"></div>

    <div style="margin-top: 30px;">
      <a href="index.html" class="btn btn-primary" style="display: inline-block; text-align: center; text-decoration: none; width: auto; padding: 12px 24px;">← Вернуться на главную</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const dataRaw = localStorage.getItem("lastQuizResult");
      if (!dataRaw) return;

      const data = JSON.parse(dataRaw);

      document.getElementById("reportBadge").innerText = `${data.schoolKey || 'ACADEMY'} EVALUATION REPORT`;
      document.getElementById("reportTitle").innerText = data.schoolTitle || "Результаты теста";
      document.getElementById("resIc").innerText = data.icName || "-";
      document.getElementById("resOoc").innerText = data.oocName || "-";
      document.getElementById("resTime").innerText = data.timeSpent || "-";
      document.getElementById("resTabs").innerText = `${data.tabSwitches} раз(а)`;

      const container = document.getElementById("qaContainer");
      container.innerHTML = "";

      if (data.qaList && data.qaList.length > 0) {
        data.qaList.forEach((item) => {
          const card = document.createElement("div");
          card.className = "qa-card";
          card.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.answer}</p>
          `;
          container.appendChild(card);
        });
      }
    });
  </script>
</body>
</html>
