<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результаты | LSPD</title>
<style>
:root{--bg:#070b13;--panel:#0e1624;--border:#223047;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#12304a 0,#070b13 40%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.container{width:min(960px,calc(100% - 28px));margin:28px auto 50px}.header{padding:28px;background:linear-gradient(135deg,#101c2d,#0b1320);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.3)}
.badge{display:inline-block;color:#7dd3fc;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);padding:6px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
h1{font-size:clamp(25px,5vw,38px);margin:12px 0 5px;letter-spacing:-.03em}.sub{color:var(--muted);margin:0;font-size:13px}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.info-box{background:#0e1726;border:1px solid var(--border);border-radius:13px;padding:15px}.info-box label{display:block;color:#64748b;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}.info-box span{font-size:14px;font-weight:800;word-break:break-word}
.section-title{margin:28px 0 12px;font-size:17px}.qa{background:#0e1624;border:1px solid var(--border);border-radius:13px;padding:16px 17px;margin:9px 0}.qa h3{font-size:13px;color:#7dd3fc;margin:0 0 8px;line-height:1.45}.qa p{margin:0;color:#e2e8f0;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.empty{padding:18px;background:#0e1624;border:1px solid var(--border);border-radius:13px;color:var(--muted)}.back{display:inline-block;margin-top:24px;padding:12px 18px;border-radius:10px;background:#0ea5e9;color:white;text-decoration:none;font-weight:800;font-size:13px}
@media(max-width:760px){.info{grid-template-columns:1fr 1fr}}@media(max-width:460px){.container{width:100%;margin:0}.header{border-radius:0}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header class="header">
  <span class="badge" id="badge">Evaluation Report</span>
  <h1 id="title">Результаты тестирования</h1>
  <p class="sub">Итоговая карточка прохождения теста кандидатом.</p>
</header>

<div class="info">
  <div class="info-box"><label>IC Никнейм</label><span id="ic">-</span></div>
  <div class="info-box"><label>OOC / Discord</label><span id="ooc">-</span></div>
  <div class="info-box"><label>Время</label><span id="time">-</span></div>
  <div class="info-box"><label>Уходов с вкладки</label><span id="tabs">0</span></div>
</div>

<div id="answers"></div>
<a class="back" href="index.html">← Вернуться на главную</a>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const root=document.getElementById("answers");
  const raw=localStorage.getItem("lastQuizResult");

  if(!raw){
    root.innerHTML='<div class="empty">Результаты в этом браузере не найдены.</div>';
    return;
  }

  let data;
  try{data=JSON.parse(raw)}catch(e){
    root.innerHTML='<div class="empty">Не удалось прочитать результаты.</div>';
    return;
  }

  const text=(v,fallback="-")=>{
    const s=String(v??"").trim();
    return s||fallback;
  };

  document.getElementById("badge").textContent=`${text(data.schoolKey,"TEST")} EVALUATION REPORT`;
  document.getElementById("title").textContent=text(data.schoolTitle,"Результаты тестирования");
  document.getElementById("ic").textContent=text(data.icName);
  document.getElementById("ooc").textContent=text(data.oocName);
  document.getElementById("time").textContent=text(data.timeSpent);
  document.getElementById("tabs").textContent=`${Number(data.tabSwitches)||0} раз(а)`;

  const order={q:1,ord:2,s:3,case:4};
  const headings={q:"Ответы на вопросы",ord:"Последовательность действий",s:"Ситуационные задачи",case:"Кейс-ситуации"};

  const list=Array.isArray(data.qaList)?[...data.qaList].sort((a,b)=>{
    const t=(order[a.type]||99)-(order[b.type]||99);
    return t || ((Number(a.order)||0)-(Number(b.order)||0));
  }):[];

  if(!list.length){
    root.innerHTML='<div class="empty">Ответы не найдены.</div>';
    return;
  }

  let last="";
  list.forEach(item=>{
    const type=item.type||"q";

    if(type!==last){
      last=type;
      const h=document.createElement("h2");
      h.className="section-title";
      h.textContent=headings[type]||"Ответы";
      root.appendChild(h);
    }

    const card=document.createElement("div");
    card.className="qa";

    const h=document.createElement("h3");
    h.textContent=text(item.title,"Вопрос");

    const p=document.createElement("p");
    p.textContent=text(item.answer,"Нет ответа");

    card.append(h,p);
    root.appendChild(card);
  });
});
</script>
</body>
</html>
