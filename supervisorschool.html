<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школа супервайзеров</title>
  <link rel="stylesheet" href="style.css?v=13">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="portal-header">
      <div class="result-badge">SUPERVISORY ACADEMY</div>
      <h1>Тестирование супервайзеров смены</h1>
      <p style="color: #9ca3af;">Оценка навыков управления ситуацией, разрешения конфликтов и тактического руководства.</p>
    </div>

    <form id="quizForm" onsubmit="processQuizSubmission(event, 'SUPERVISOR', 'Школа супервайзеров')">
      <div class="form-step active">
        <div class="section-header"><h2>Данные кандидата</h2></div>
        <div class="form-group">
          <label>Имя и Фамилия (IC) *</label>
          <input type="text" id="ic_name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Discord / OOC данные *</label>
          <input type="text" id="ooc_name" required placeholder="username#0000">
        </div>
      </div>

      <div class="qa-group form-group" style="margin-top: 25px;">
        <label class="question-title">1. Алгоритм действий супервайзера при инциденте с применением оружия на поражение офицером (Officer-Involved Shooting)?</label>
        <textarea required placeholder="Введите ваш развернутый ответ..."></textarea>
      </div>

      <div class="qa-group form-group">
        <label class="question-title">2. Порядок распределения юнитов и координации при объявлении режима чрезвычайной ситуации в секторе?</label>
        <textarea required placeholder="Введите ваш развернутый ответ..."></textarea>
      </div>

      <div class="qa-group form-group">
        <label class="question-title">3. Порядок рассмотрения дисциплинарных нарушения и разрешений споров между офицерами вашей смены?</label>
        <textarea required placeholder="Введите ваш развернутый ответ..."></textarea>
      </div>

      <div style="margin-top: 30px; display: flex; gap: 15px;">
        <a href="index.html" class="btn btn-secondary" style="text-decoration:none; text-align:center;">Отмена</a>
        <button type="submit" class="btn btn-primary">Завершить и отправить</button>
      </div>
    </form>
  </div>

  <script src="quiz-handler.js"></script>
</body>
</html>
